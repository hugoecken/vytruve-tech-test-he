name: Roll back application

on:
  workflow_dispatch:
    inputs:
      component:
        description: Application to restore
        required: true
        type: choice
        options: [api, web]
      digest:
        description: Previously published sha256 digest
        required: true
        type: string
      revision:
        description: Full source revision carried by the image
        required: true
        type: string

permissions:
  packages: write

jobs:
  rollback:
    name: rollback ${{ inputs.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      DIGEST: ${{ inputs.digest }}
      REVISION: ${{ inputs.revision }}
      PRODUCTION_ORIGIN: ${{ vars.PRODUCTION_ORIGIN }}
    steps:
      - name: Validate immutable inputs
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Restore and verify API
        if: inputs.component == 'api'
        env:
          DOKPLOY_API_WEBHOOK_URL: ${{ secrets.DOKPLOY_API_WEBHOOK_URL }}
        run: |
          docker buildx imagetools create --tag ghcr.io/hugoecken/vytruve-api:production "ghcr.io/hugoecken/vytruve-api@$DIGEST"
          curl --fail --silent --show-error --request POST --output /dev/null "$DOKPLOY_API_WEBHOOK_URL"
          curl --fail --silent --show-error --retry 30 --retry-delay 5 --retry-all-errors "$PRODUCTION_ORIGIN/api/health/ready/$REVISION"

      - name: Restore and verify Web
        if: inputs.component == 'web'
        env:
          DOKPLOY_WEB_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEB_WEBHOOK_URL }}
        run: |
          docker buildx imagetools create --tag ghcr.io/hugoecken/vytruve-web:production "ghcr.io/hugoecken/vytruve-web@$DIGEST"
          curl --fail --silent --show-error --request POST --output /dev/null "$DOKPLOY_WEB_WEBHOOK_URL"
          curl --fail --silent --show-error --retry 30 --retry-delay 5 --retry-all-errors "$PRODUCTION_ORIGIN/health/$REVISION"
